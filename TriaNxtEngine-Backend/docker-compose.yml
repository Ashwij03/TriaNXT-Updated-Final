services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-trianxt_ctms}
      POSTGRES_USER: ${DB_USER:-trianxt}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_local_only}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trianxt} -d ${DB_NAME:-trianxt_ctms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  engine:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # APP_ENV replaces DJANGO_ENV (old name still accepted by config.py).
      APP_ENV: development
      SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-not-for-production-change-me-immediately}
      ALLOWED_HOSTS: localhost,127.0.0.1,engine
      CTMS_ENCRYPTION_KEY: ${CTMS_ENCRYPTION_KEY:-dev-only-local-key-change-me}
      DATABASE_URL: postgresql+psycopg2://${DB_USER:-trianxt}:${DB_PASSWORD:-changeme_local_only}@db:5432/${DB_NAME:-trianxt_ctms}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
    ports:
      - "8000:8000"
    # Run migrations (alembic) before gunicorn starts. Overrides the
    # Dockerfile's CMD for local smoke-testing only — remove this for the
    # real ECS task def in later steps, where migrations should run as a
    # separate one-off task, not on every container start.
    command: ["sh", "-c", "alembic upgrade head && gunicorn tria_engine.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 4 --timeout 60 --access-logfile - --error-logfile -"]

volumes:
  db_data:
