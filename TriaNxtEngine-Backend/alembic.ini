# alembic.ini — TriaNXT CTMS engine migrations
#
# The SQLAlchemy URL is resolved at runtime by tria_engine/alembic/env.py
# from DATABASE_URL (or the dev SQLite fallback) — same single source of
# truth as the application.

[alembic]
script_location = %(here)s/tria_engine/alembic
prepend_sys_path = %(here)s
# file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
